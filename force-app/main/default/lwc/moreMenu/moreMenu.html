<template>
    <div class="slds-p-around_medium page-container">
        <h1 class="slds-text-heading_medium slds-m-bottom_medium">More</h1>
        <template for:each={menuItems} for:item="item">
            <button type="button" key={item.id} class="slds-button slds-button_reset menu-card" data-id={item.id} onclick={handleNavigate}>
                <span class="menu-card-icon">
                    <lightning-icon icon-name={item.icon} size="small"></lightning-icon>
                </span>
                <span class="menu-card-body">
                    <span class="slds-text-heading_small">{item.title}</span>
                    <span class="slds-text-body_small slds-text-color_weak">{item.description}</span>
                </span>
                <lightning-icon icon-name="utility:chevronright" size="x-small"></lightning-icon>
            </button>
        </template>
    </div>
</template>
