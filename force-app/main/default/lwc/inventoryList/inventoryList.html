<template>
    <div class="slds-p-around_medium page-container">
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium">
            <h1 class="slds-text-heading_medium">Inventory</h1>
            <lightning-button-icon
                data-id="fab"
                icon-name="utility:add"
                variant="brand"
                size="large"
                onclick={handleToggleCreateForm}
                alternative-text="New Part"
            ></lightning-button-icon>
        </div>

        <lightning-input
            data-id="search"
            type="search"
            variant="label-hidden"
            label="Search"
            placeholder="Search by name, SKU, or barcode"
            value={searchTerm}
            onchange={handleSearchChange}
            class="slds-m-bottom_medium"
        ></lightning-input>

        <template if:true={showCreateForm}>
            <div class="slds-box slds-box_x-small slds-m-bottom_medium">
                <p class="slds-text-heading_small slds-m-bottom_x-small">New Part</p>
                <lightning-input data-field="name" label="Name" value={newPart.name} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-field="sku" label="SKU" value={newPart.sku} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-field="barcode" label="Barcode" value={newPart.barcode} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-field="price" type="number" formatter="currency" step="0.01" label="Price" value={newPart.price} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-field="openingStock" type="number" label="Opening Stock" value={newPart.openingStock} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-field="lowStockThreshold" type="number" label="Low Stock Threshold" value={newPart.lowStockThreshold} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-combobox data-field="gstType" label="GST Type" value={newPart.gstType} options={gstTypeOptions} onchange={handleGstTypeChange} class="slds-m-bottom_x-small"></lightning-combobox>
                <lightning-input data-field="taxRatePercent" type="number" label="Tax Rate %" value={newPart.taxRatePercent} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-field="hsnCode" label="HSN Code" value={newPart.hsnCode} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-field="unitLabel" label="Unit (e.g. pcs)" value={newPart.unitLabel} onchange={handleFieldChange} class="slds-m-bottom_small"></lightning-input>
                <lightning-button data-id="save" label="Save Part" variant="brand" disabled={saveDisabled} onclick={handleSave}></lightning-button>
                <lightning-button label="Cancel" onclick={handleToggleCreateForm} class="slds-m-left_x-small"></lightning-button>
            </div>
        </template>

        <template if:true={hasParts}>
            <template for:each={decoratedParts} for:item="part">
                <button type="button" key={part.id} class="slds-button slds-button_reset part-row" data-id={part.id} onclick={handleSelectPart}>
                    <span class={part.iconContainerClass}>
                        <lightning-icon data-id="low-stock-icon" icon-name="utility:warning" variant="error" size="x-small" if:true={part.isLowStock}></lightning-icon>
                    </span>
                    <span class="part-row-body">
                        <span class="slds-text-heading_small">{part.name}</span>
                        <span class={part.stockLineClass}>Stock: {part.currentStock} • ₹{part.price}</span>
                    </span>
                    <lightning-icon icon-name="utility:chevronright" size="x-small"></lightning-icon>
                </button>
            </template>
        </template>

        <template if:true={hasNoParts}>
            <p class="slds-text-color_weak slds-p-vertical_medium">No parts found.</p>
        </template>
    </div>
</template>
