<template>
    <div class="slds-p-around_medium page-container">
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium">
            <h1 class="slds-text-heading_medium">Mechanics</h1>
            <div class="slds-grid slds-grid_vertical-align-center">
                <lightning-input data-id="show-inactive" type="toggle" label="Show inactive" checked={showInactive} onchange={handleToggleShowInactive} class="slds-m-right_small"></lightning-input>
                <lightning-button-icon
                    data-id="fab"
                    icon-name="utility:add"
                    variant="brand"
                    size="large"
                    onclick={handleToggleCreateForm}
                    alternative-text="New Mechanic"
                ></lightning-button-icon>
            </div>
        </div>

        <template if:true={showCreateForm}>
            <div class="slds-box slds-box_x-small slds-m-bottom_medium">
                <lightning-input data-id="new-name" label="Name" value={newName} onchange={handleNameChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-id="new-phone" label="Phone" value={newPhone} onchange={handlePhoneChange} class="slds-m-bottom_small"></lightning-input>
                <lightning-button data-id="save" label="Save" variant="brand" disabled={saveDisabled} onclick={handleSave}></lightning-button>
                <lightning-button label="Cancel" onclick={handleToggleCreateForm} class="slds-m-left_x-small"></lightning-button>
            </div>
        </template>

        <template if:true={hasPeople}>
            <template for:each={people} for:item="person">
                <div key={person.id} class="slds-grid slds-grid_align-spread person-row">
                    <span class="person-row-body">
                        <span class="slds-text-heading_small">{person.name}</span>
                        <span class="slds-text-body_small slds-text-color_weak">{person.phone}</span>
                    </span>
                    <lightning-input type="toggle" data-id={person.id} checked={person.isActive} onchange={handleToggleActive}></lightning-input>
                </div>
            </template>
        </template>
    </div>
</template>
