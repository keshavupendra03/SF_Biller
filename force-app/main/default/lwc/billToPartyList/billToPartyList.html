<template>
    <div class="slds-p-around_medium page-container">
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium">
            <h1 class="slds-text-heading_medium">Bill-To Parties</h1>
            <lightning-button-icon
                data-id="fab"
                icon-name="utility:add"
                variant="brand"
                size="large"
                onclick={handleToggleCreateForm}
                alternative-text="New Bill-To Party"
            ></lightning-button-icon>
        </div>

        <lightning-input
            data-id="search"
            type="search"
            variant="label-hidden"
            label="Search"
            placeholder="Search by name"
            value={searchTerm}
            onchange={handleSearchChange}
            class="slds-m-bottom_medium"
        ></lightning-input>

        <template if:true={showCreateForm}>
            <div class="slds-box slds-box_x-small slds-m-bottom_medium">
                <lightning-input data-field="name" label="Party Name" value={newParty.name} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-field="address" label="Address" value={newParty.address} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-field="contactPhone" label="Contact Phone" value={newParty.contactPhone} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-field="gstin" label="GSTIN" value={newParty.gstin} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-field="state" label="State" value={newParty.state} onchange={handleFieldChange} class="slds-m-bottom_small"></lightning-input>
                <lightning-button data-id="save" label="Save" variant="brand" disabled={saveDisabled} onclick={handleSave}></lightning-button>
                <lightning-button label="Cancel" onclick={handleToggleCreateForm} class="slds-m-left_x-small"></lightning-button>
            </div>
        </template>

        <template if:true={hasParties}>
            <template for:each={parties} for:item="party">
                <div key={party.id} class="party-row">
                    <span class="slds-text-heading_small">{party.name}</span>
                    <span class="slds-text-body_small slds-text-color_weak">GSTIN: {party.gstin}</span>
                </div>
            </template>
        </template>
    </div>
</template>
