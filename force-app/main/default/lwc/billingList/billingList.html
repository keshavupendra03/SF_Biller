<template>
    <div class="slds-p-around_medium page-container">
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium">
            <h1 class="slds-text-heading_medium">Billing</h1>
            <div class="slds-grid slds-grid_vertical-align-center">
                <lightning-button
                    data-id="quick-bill"
                    label={kind.quickLabel}
                    icon-name="utility:bolt"
                    onclick={handleQuickBill}
                    class="slds-m-right_x-small"
                ></lightning-button>
                <lightning-button-icon
                    data-id="fab"
                    icon-name="utility:add"
                    variant="brand"
                    size="large"
                    onclick={handleNewBill}
                    alternative-text={kind.newLabel}
                ></lightning-button-icon>
            </div>
        </div>

        <lightning-radio-group
            data-id="list-type"
            type="button"
            label="Show"
            variant="label-hidden"
            options={listOptions}
            value={listType}
            onchange={handleListTypeChange}
            class="slds-m-bottom_small"
        ></lightning-radio-group>

        <c-company-picker allow-all value={companyFilter} oncompanychange={handleCompanyFilter}></c-company-picker>

        <template lwc:if={hasGstReminders}>
            <div class={gstReminderClass} role="status" data-id="gst-reminder">
                <div class="slds-media slds-media_center">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="utility:clock" size="x-small" alternative-text="GST returns due"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <template for:each={gstReminders} for:item="reminder">
                            <p key={reminder.key} data-id="gst-reminder-line">{reminder.text}</p>
                        </template>
                    </div>
                    <div class="slds-media__figure slds-media__figure_reverse">
                        <lightning-button data-id="open-gst-returns" variant="base" label="GST Returns" onclick={handleOpenGstReturns}></lightning-button>
                    </div>
                </div>
            </div>
        </template>

        <lightning-input
            data-id="search"
            type="search"
            variant="label-hidden"
            label="Search"
            placeholder={kind.searchPlaceholder}
            value={searchTerm}
            onchange={handleSearchChange}
            class="slds-m-bottom_medium"
        ></lightning-input>

        <!-- Record Payment feature disabled (2026-10) — uncomment alongside billingList.js to restore the All/Dues Only filter.
        <div class="slds-m-bottom_medium">
            <lightning-button data-id="filter-all" label="All" variant={allButtonVariant} onclick={handleShowAll} class="slds-m-right_x-small"></lightning-button>
            <lightning-button data-id="filter-dues" label="Dues Only" variant={duesOnlyButtonVariant} onclick={handleShowDuesOnly}></lightning-button>
        </div>
        -->

        <template if:true={hasBills}>
            <template for:each={decoratedBills} for:item="bill">
                <div key={bill.id} class="bill-row" data-id="row">
                    <button type="button" class="slds-button slds-button_reset bill-row-main" data-id={bill.id} onclick={handleSelectBill}>
                        <span class="bill-row-body">
                            <span class="slds-text-heading_small">{bill.number}</span>
                            <template if:true={bill.isDeleted}>
                                <span class="slds-badge slds-theme_error" data-id="deleted-badge">Deleted</span>
                            </template>
                            <template if:true={bill.dateText}>
                                <span class="slds-text-body_small slds-text-color_weak" data-id="bill-date">{bill.dateText}</span>
                            </template>
                            <span class="slds-text-body_small slds-text-color_weak">{bill.name}</span>
                            <template if:true={bill.buyer}>
                                <span class="slds-text-body_small slds-text-color_weak" data-id="bill-buyer">{bill.buyer}</span>
                            </template>
                            <template if:true={bill.companyName}>
                                <span class="slds-text-body_small slds-text-color_weak" data-id="bill-company">{bill.companyName}</span>
                            </template>
                        </span>
                        <span class="bill-row-amount">
                            <span class="slds-text-heading_small">₹{bill.totalAmount}</span>
                            <!-- Record Payment feature disabled (2026-10) — uncomment alongside billingList.js to restore the status badge.
                            <span class={bill.badgeClass}>{bill.status}</span>
                            -->
                        </span>
                    </button>
                    <template if:false={bill.isArchived}>
                        <lightning-button
                            data-id="easy-bill"
                            data-record={bill.id}
                            label="Easy Bill"
                            title={bill.easyBillLabel}
                            icon-name="utility:edit"
                            onclick={handleOpenInEasyBill}
                            class="bill-row-easy"
                        ></lightning-button>
                    </template>
                </div>
            </template>
        </template>

        <template if:true={hasNoBills}>
            <p class="slds-text-color_weak slds-p-vertical_medium">{kind.empty}</p>
        </template>

        <template if:true={showDeletedToggle}>
            <lightning-button data-id="toggle-deleted" variant="base" label={deletedToggleLabel} onclick={handleToggleDeleted} class="slds-m-top_small"></lightning-button>
        </template>

        <template lwc:if={openArchived}>
            <c-archived-bill bill-id={openArchived.billId} document-id={openArchived.documentId}
                onclose={handleCloseArchived} onrestored={handleRestored}></c-archived-bill>
        </template>
    </div>
</template>
