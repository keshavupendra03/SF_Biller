<template>
    <div class="slds-p-around_medium page-container">
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium">
            <h1 class="slds-text-heading_medium">Billing</h1>
            <lightning-button-icon
                data-id="fab"
                icon-name="utility:add"
                variant="brand"
                size="large"
                onclick={handleNewBill}
                alternative-text="New Bill"
            ></lightning-button-icon>
        </div>

        <lightning-input
            data-id="search"
            type="search"
            variant="label-hidden"
            label="Search"
            placeholder="Search by invoice number, customer name, or phone"
            value={searchTerm}
            onchange={handleSearchChange}
            class="slds-m-bottom_medium"
        ></lightning-input>

        <!-- Record Payment feature disabled (2026-10) — uncomment alongside billingList.js to restore the All/Dues Only filter.
        <div class="slds-m-bottom_medium">
            <lightning-button data-id="filter-all" label="All" variant={allButtonVariant} onclick={handleShowAll} class="slds-m-right_x-small"></lightning-button>
            <lightning-button data-id="filter-dues" label="Dues Only" variant={duesOnlyButtonVariant} onclick={handleShowDuesOnly}></lightning-button>
        </div>
        -->

        <template if:true={hasBills}>
            <template for:each={decoratedBills} for:item="bill">
                <button type="button" key={bill.id} class="slds-button slds-button_reset bill-row" data-id={bill.id} onclick={handleSelectBill}>
                    <span class="bill-row-body">
                        <span class="slds-text-heading_small">{bill.invoiceNumber}</span>
                        <span class="slds-text-body_small slds-text-color_weak">{bill.customerName}</span>
                    </span>
                    <span class="bill-row-amount">
                        <span class="slds-text-heading_small">₹{bill.totalAmount}</span>
                        <!-- Record Payment feature disabled (2026-10) — uncomment alongside billingList.js to restore the status badge.
                        <span class={bill.badgeClass}>{bill.status}</span>
                        -->
                    </span>
                </button>
            </template>
        </template>

        <template if:true={hasNoBills}>
            <p class="slds-text-color_weak slds-p-vertical_medium">No bills found.</p>
        </template>
    </div>
</template>
