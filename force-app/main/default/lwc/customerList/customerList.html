<template>
    <div class="slds-p-around_medium page-container">
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium">
            <h1 class="slds-text-heading_medium">Customers</h1>
            <div class="slds-grid slds-grid_vertical-align-center">
                <lightning-button
                    data-id="print-job-slip"
                    label="Print Job Slip"
                    icon-name="utility:print"
                    disabled={isOpeningJobSlip}
                    onclick={handlePrintJobSlip}
                    class="slds-m-right_x-small"
                ></lightning-button>
                <lightning-button-icon
                    data-id="fab"
                    icon-name="utility:add"
                    variant="brand"
                    size="large"
                    onclick={handleToggleCreateForm}
                    alternative-text="New Customer"
                ></lightning-button-icon>
            </div>
        </div>

        <lightning-input
            data-id="search"
            type="search"
            variant="label-hidden"
            label="Search"
            placeholder="Search by name, phone, or reg..."
            value={searchTerm}
            onchange={handleSearchChange}
            class="slds-m-bottom_medium"
        ></lightning-input>

        <template if:true={showCreateForm}>
            <div class="slds-box slds-box_x-small slds-m-bottom_medium">
                <p class="slds-text-heading_small slds-m-bottom_x-small">New Customer</p>
                <lightning-input data-field="name" label="Name" value={newCustomer.name} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-field="phone" label="Phone" value={newCustomer.phone} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-field="address" label="Address" value={newCustomer.address} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-field="email" label="Email" value={newCustomer.email} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-field="gstin" label="GSTIN" value={newCustomer.gstin} onchange={handleFieldChange} class="slds-m-bottom_x-small"></lightning-input>
                <lightning-input data-field="state" label="State (e.g. 23-Madhya Pradesh)" value={newCustomer.state} onchange={handleFieldChange} class="slds-m-bottom_small"></lightning-input>
                <lightning-button data-id="save" label="Save Customer" variant="brand" disabled={saveDisabled} onclick={handleSave}></lightning-button>
                <lightning-button label="Cancel" onclick={handleToggleCreateForm} class="slds-m-left_x-small"></lightning-button>
            </div>
        </template>

        <template if:true={hasCustomers}>
            <ul class="list-rows">
                <template for:each={decoratedCustomers} for:item="cust">
                    <li key={cust.id}>
                        <button type="button" class="slds-button slds-button_reset list-row" data-id={cust.id} onclick={handleSelectCustomer}>
                            <span class="avatar-circle">{cust.initial}</span>
                            <span class="list-row-body">
                                <span class="slds-text-body_regular slds-text-heading_small">{cust.name}</span>
                                <span class="slds-text-body_small slds-text-color_weak">{cust.phone}</span>
                            </span>
                            <lightning-icon icon-name="utility:chevronright" size="x-small"></lightning-icon>
                        </button>
                    </li>
                </template>
            </ul>
        </template>

        <template if:true={hasNoCustomers}>
            <p class="slds-text-color_weak slds-p-vertical_medium">No customers found.</p>
        </template>

        <template if:true={slipCompanies}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-label="Print job slip" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Print job slip for which company?</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <template for:each={slipCompanies} for:item="company">
                            <lightning-button key={company.id} data-id={company.id} class="slip-company" label={company.name} icon-name="utility:print" onclick={handleChooseSlipCompany} stretch></lightning-button>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button data-id="cancel-slip-company" label="Cancel" onclick={handleCancelSlipCompany}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <template if:true={blankSlipRecordId}>
            <c-document-preview record-id={blankSlipRecordId} page-name="JobSlipPdf" heading="Blank Job Slip" onclose={handleCloseJobSlip}></c-document-preview>
        </template>
    </div>
</template>
